[package]
name    = "watax_notes"
version = "0.1.0"
desc    = "Reference application for the watax web framework."
license = "MIT"
bin     = "src/main.tr"

[deps]
# watax is the sibling workspace member (the repo root, two dirs up). templa is
# pulled in transitively from watax's own [deps] (github source), so it is NOT
# listed here — that keeps a single agreed source for templa across the graph.
watax = "local:../.."
